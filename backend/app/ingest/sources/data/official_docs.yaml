# Link-only source: official documentation and learning guides (Phase 7, task 12)
#
# These are the front doors of documentation that the tool's own makers publish: the
# language, framework, platform or standards body behind the skill. They are the most
# trusted links in a learning plan, because the people who build the tool keep them up
# to date.
#
# We copy nothing. Each entry is a link, a title, and one plain sentence that we wrote
# ourselves. Every page belongs to its publisher, so the licence is recorded as
# "proprietary" (link only), the same way roadmap.sh is.
#
# Choosing an address:
#   - Use the top page of a guide or tutorial, never a deep page. Deep pages move.
#   - Write the address the way `normalise_url()` would: https, no trailing slash
#     (except a site root), no tracking parameters.
#   - Write the summary about what the reader will learn, in our own words.
#
# These addresses were written from knowledge of the sites and have NOT yet been tested
# on the live web. Run the link check (python -m app.ingest.run --source official-docs
# --dry-run) from a machine with internet access. A page that answers 404 or 410 is
# dropped and listed in the report, and a replacement address can then be added here.
# Sites that block bots (403, 429) are kept, as the check cannot tell.

source_id: official-docs
site: https://developer.mozilla.org
licence: proprietary
attribution: "Official documentation, owned by each publisher. Link only: no content is copied."
content_type: docs

