# Link-only source: freeCodeCamp (Phase 7, task 12)
#
# freeCodeCamp is a free, non-profit learning site with a course curriculum, a large
# library of articles, and a YouTube channel of long video courses. The vetting log
# (docs/mcp/vetting-log.md) approves it for LINKS only. Its licences and terms are not
# all confirmed (the log lists what is unread), so we copy nothing: each entry is a
# link, a title, and one plain sentence that we wrote ourselves.
#
# Three kinds of link, each with its own content type:
#   course  the hands-on curriculum at /learn (a learner works through it in the browser)
#   video   freeCodeCamp's YouTube channel and playlists
#   article topic pages of the freeCodeCamp news site, each a list of articles on one skill
#
# Choosing an address:
#   - Use the top page of a course, a channel or a topic, never a single article or video.
#     Those move or are replaced, and the link check cannot tell that a page has changed.
#   - Write the address the way `normalise_url()` would: https, no trailing slash
#     (except a site root), no tracking parameters.
#
# Not tested on the live web yet. The curriculum addresses under /learn are the most
# likely to change, because freeCodeCamp renames and reorders its certifications from
# time to time. Run the link check (python -m app.ingest.run --source freecodecamp
# --dry-run) from a machine with internet access. A page that answers 404 or 410 is
# dropped and listed in the report, and a replacement address can then be added here.
# YouTube may ask for consent or block bots (403, 429, a redirect): the check cannot tell
# that apart from a working page, so such links are kept.

source_id: freecodecamp
site: https://www.freecodecamp.org
licence: proprietary
attribution: "freeCodeCamp. Link only: no content is copied."
content_type: course

